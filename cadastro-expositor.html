<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crie seu cadastro de expositor | BECO</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="association.css"><link rel="stylesheet" href="form-enhancements.css"><link rel="stylesheet" href="assets/workflows.css"></head><body data-page="register"><header class="site-header"><a class="brand" href="index.html"><span class="brand-symbol">B</span><span>BECO<br>memória viva</span></a><nav class="nav"><a href="feiras.html">Nossas feiras</a><a href="expositores.html">Expositores</a></nav><div class="header-actions"><a class="btn btn-secondary" href="login.html">Entrar</a></div></header><main><section class="form-shell"><div class="form-head"><span class="eyebrow">Plataforma BECO</span><h1>Crie seu cadastro de expositor</h1><p>Crie uma conta para preencher candidaturas, enviar imagens e acompanhar a curadoria. Seu perfil começa privado.</p></div><form class="form-body" data-register-form><div class="form-grid"><label class="form-field">Nome completo<input name="fullName" type="text" required minlength="3" maxlength="180" autocomplete="name"></label><label class="form-field">Nome do seu trabalho ou marca<input name="displayName" type="text" required minlength="2" maxlength="180"></label><label class="form-field">E-mail<input name="email" type="email" required autocomplete="email"></label><label class="form-field">Confirme seu e-mail<input name="emailConfirmation" type="email" required></label><label class="form-field">Senha (mínimo de 10 caracteres, letras e números)<input name="password" type="password" required minlength="10" maxlength="200" autocomplete="new-password" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{10,}"></label><label class="form-field">Confirme sua senha<input name="passwordConfirmation" type="password" required minlength="10" autocomplete="new-password"></label><label class="form-field">WhatsApp<input name="phone" type="tel" required minlength="8" maxlength="30" autocomplete="tel"></label><label class="form-field">Instagram profissional (opcional)<input name="instagramUrl" type="url" placeholder="https://instagram.com/seuperfil"></label><label class="form-field">Cidade<input name="city" type="text" required maxlength="120" autocomplete="address-level2"></label><label class="form-field">Estado (UF)<input name="state" type="text" required minlength="2" maxlength="2" pattern="[A-Za-z]{2}" autocomplete="address-level1"></label></div><label class="check-row"><input name="acceptedTerms" required type="checkbox"><span>Declaro que os dados são verdadeiros e concordo com o uso das informações para cadastro, curadoria e organização das feiras. A publicação do perfil dependerá da minha autorização e da aprovação da equipe.</span></label><p data-feedback aria-live="polite"></p><button class="btn btn-primary" type="submit">Criar minha conta</button><p>Já tem cadastro? <a href="login.html">Entrar</a></p></form></section></main><footer class="site-footer"><p>BECO · memória viva · <a href="login.html">Entrar</a></p></footer><div class="toast" id="toast" role="status"></div><script src="script.js"></script></body></html>
